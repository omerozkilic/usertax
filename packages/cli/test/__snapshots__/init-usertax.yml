# Generated by `usertax init`. Docs: https://github.com/omerozkilic/usertax
# Step 1 of 2: builds and measures with a read-only token; usertax-comment.yml comments.
name: usertax
on:
  pull_request:
  push:
    branches: [trunk] # stores the base report that pull requests are compared with
  workflow_dispatch: # run on the default branch to recreate a missing base report
permissions:
  contents: read
jobs:
  usertax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build # build with source maps (see the notes of usertax init)
      - id: usertax
        uses: omerozkilic/usertax-action@v0 # zizmor: ignore[unpinned-uses] pin a commit SHA to freeze the action
        with:
          mode: measure
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.usertax.outputs.report
        with:
          name: ${{ steps.usertax.outputs.artifact-name }}
          path: ${{ steps.usertax.outputs.report }}
          retention-days: 90
