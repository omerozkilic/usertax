# Generated by `usertax init`. Docs: https://github.com/omerozkilic/usertax
# Step 2 of 2: posts the comment from the default branch and reads the report as data.
name: usertax comment
on:
  workflow_run:
    workflows: [usertax]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: write
  statuses: write
jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # The default branch, never the pull request: your trusted configuration.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: usertax-head
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: .usertax-head
      - uses: omerozkilic/usertax-action@v0
        with:
          mode: comment
          head-report: .usertax-head/usertax-report.json
