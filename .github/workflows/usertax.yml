name: usertax

# Dogfooding, step 1 of the fork-safe setup (ADR 0005): build and measure the example apps with
# the action from this repository. Runs untrusted pull request code with a read-only token and
# no secrets; the comment is posted by usertax-comment.yml.
on:
  pull_request:
  push:
    branches: [main]
  # Recreates the base report of the default branch when it is missing or expired (ADR 0014).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: Measure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm build:action
      - run: pnpm build:examples
      - id: usertax
        uses: ./packages/action # zizmor: ignore[self-repository] the action is built in this workspace first
        with:
          mode: measure
          config: .github/usertax.config.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.usertax.outputs.artifact-name }}
          path: ${{ steps.usertax.outputs.report }}
          retention-days: 90
