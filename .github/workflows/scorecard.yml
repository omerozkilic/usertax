name: Scorecard

# OpenSSF Scorecard: an independent, repeatable check of the repository's security posture
# (branch protection, pinned dependencies, token permissions, security policy, signed releases).
# Results go to code scanning and are published to scorecard.dev, which serves the README badge.
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 2'

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    # Publishing and code scanning need a public repository.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Upload the SARIF results to code scanning.
      security-events: write
      # Publish the results to scorecard.dev with an OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
