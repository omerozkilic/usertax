name: usertax comment

# Dogfooding, step 2 of the fork-safe setup (ADR 0005): runs the action from the default branch,
# never the pull request's code, and treats the measured report as untrusted data.
on:
  workflow_run:
    workflows: [usertax]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write
  statuses: write

jobs:
  comment:
    name: Comment
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm build:action
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: usertax-head
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: .usertax-head
      - uses: ./packages/action
        with:
          mode: comment
          config: .github/usertax.config.json
          head-report: .usertax-head/usertax-report.json
