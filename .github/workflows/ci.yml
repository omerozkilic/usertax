name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # typecheck builds the packages; lint needs the build output for bin/ files.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: node scripts/update-alternatives.js --check
      - run: pnpm test:coverage
      - name: Coverage summary
        if: always() && matrix.node == 24 && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const rows = ["lines", "statements", "functions", "branches"]
              .map((k) => `| ${k} | ${t[k].pct}% |`).join("\n");
            console.log(`### Coverage\n\n| Metric | Covered |\n| --- | --- |\n${rows}`);
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: CLI smoke test
        run: |
          node packages/cli/bin/usertax.js --version
          node scripts/mcp-smoke.js packages/cli/bin/usertax.js
      - name: Action bundle
        run: pnpm build:action && test -s packages/action/dist/index.js
      - name: npm package
        run: |
          pnpm pack:cli
          node release/npm/bin/usertax.js --version
          node scripts/mcp-smoke.js release/npm/bin/usertax.js
          (cd release/npm && npm pack --dry-run)

  examples:
    name: Examples (end to end)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:examples
      - name: Measure examples
        run: pnpm --silent e2e > e2e-report.md
      - name: Demo (adds moment to the Vite example and measures the change)
        run: pnpm --silent demo > demo-report.md
      - name: Job summary
        if: always()
        run: |
          if [ -f e2e-report.md ]; then cat e2e-report.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f demo-report.md ]; then cat demo-report.md >> "$GITHUB_STEP_SUMMARY"; fi
