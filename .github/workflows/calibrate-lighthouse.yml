name: Calibrate Lighthouse

# Measures Lighthouse run-to-run noise on GitHub-hosted runners to set the noise thresholds of
# ADR 0007 from data. Started by hand; results are uploaded as artifacts and summarised.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Lighthouse runs per page on each runner
        default: '30'
        required: true

permissions:
  contents: read

jobs:
  measure:
    name: Measure (runner ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:examples
      - name: Calibrate
        env:
          RUNS: ${{ inputs.runs }}
        run: node scripts/calibrate-lighthouse.js --runs "$RUNS" --output "calibration/shard-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: calibration-shard-${{ matrix.shard }}
          path: calibration/
          retention-days: 90

  aggregate:
    name: Aggregate
    needs: measure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: calibration-shard-*
          path: calibration/
          merge-multiple: true
      - name: Summarise
        run: node scripts/aggregate-calibration.js calibration/shard-*.json --output calibration/summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: calibration-summary
          path: calibration/
          retention-days: 90
