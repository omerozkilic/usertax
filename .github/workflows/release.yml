name: Release

# release-please opens and updates a release pull request from Conventional Commits. Merging it
# (a maintainer's decision) creates the tag vX.Y.Z and the GitHub release; the jobs below then
# publish, each only when it is configured (docs/releasing.md):
#   secrets.ACTION_REPO_DEPLOY_KEY  write deploy key of omerozkilic/usertax-action (ADR 0006)
#   vars.NPM_TRUSTED_PUBLISHING     'true' once this workflow is the package's trusted publisher
#                                   on npmjs.com (OIDC, staged publishing: a maintainer approves
#                                   each version with 2FA; no npm token is stored anywhere)
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  action-repo:
    name: Publish to usertax-action
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check for the deploy key
        id: key
        env:
          KEY: ${{ secrets.ACTION_REPO_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::ACTION_REPO_DEPLOY_KEY is not set; skipping the usertax-action repository"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release tag, not the commit that triggered this run: when two pull requests are
          # merged in quick succession, the release can be created by the run of the earlier one.
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - if: steps.key.outputs.present == 'true'
        name: Check that the checkout is the released version
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
        run: test "v$(node -p "require('./packages/action/package.json').version")" = "$TAG"
      - if: steps.key.outputs.present == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.key.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - if: steps.key.outputs.present == 'true'
        run: pnpm install --frozen-lockfile && pnpm build && pnpm build:action
      - if: steps.key.outputs.present == 'true'
        name: Smoke test the bundle as the action repository ships it
        run: node scripts/action-smoke.js
      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: omerozkilic/usertax-action
          ssh-key: ${{ secrets.ACTION_REPO_DEPLOY_KEY }} # zizmor: ignore[artipacked] the key stays configured so the next step can push
          path: usertax-action
      - if: steps.key.outputs.present == 'true'
        name: Sync, commit and tag
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
          MAJOR: v${{ needs.release-please.outputs.major }}
        run: |
          mkdir -p usertax-action/dist
          cp packages/action/action.yml usertax-action/action.yml
          cp packages/action/dist/index.js usertax-action/dist/index.js
          cp packages/action/README.md usertax-action/README.md
          cp LICENSE usertax-action/LICENSE
          # Images of the README (the Marketplace page).
          mkdir -p usertax-action/assets
          cp docs/assets/comment-add-moment.png docs/assets/comment-add-moment-dark.png usertax-action/assets/
          cd usertax-action
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: usertax $TAG" || echo "no changes"
          git tag -a "$TAG" -m "usertax $TAG"
          git tag -fa "$MAJOR" -m "usertax $TAG"
          git push origin HEAD:main
          git push origin "$TAG"
          git push --force origin "$MAJOR"

  npm:
    name: Publish to npm
    needs: release-please
    # Trusted publishing (OIDC) works only for a package that exists, so the first version is
    # published by hand and this job is switched on afterwards (docs/releasing.md).
    if: needs.release-please.outputs.released == 'true' && vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }} # see the action-repo job
          persist-credentials: false
      - name: Check that the checkout is the released version
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
        run: test "v$(node -p "require('./packages/cli/package.json').version")" = "$TAG"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No registry-url: an .npmrc with a token placeholder would make npm skip OIDC.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm build && pnpm pack:cli
      # `npm stage publish` (staged publishing) needs npm 12; pinned for reproducible releases.
      - run: npm install --global npm@12.2.1 && npm --version # zizmor: ignore[adhoc-packages] npm 12 is needed for staged publishing; the version is pinned
      # Staged, not direct: the version waits on npmjs.com until a maintainer approves it with
      # 2FA (`npm stage approve <id>` or the package's "Staged" tab). The trusted publisher on
      # npmjs.com allows only `npm stage publish`, as npm recommends (docs/releasing.md).
      - working-directory: release/npm
        run: npm stage publish --access public
