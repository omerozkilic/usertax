version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Do not take a release the day it is published; security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Do not take a release the day it is published; security updates are not delayed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      # CodeQL's init and analyze steps must run the same version, so update them together.
      codeql:
        patterns: ['github/codeql-action*']
